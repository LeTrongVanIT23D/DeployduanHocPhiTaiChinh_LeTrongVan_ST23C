<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/plugins/fontawesome-free/css/all.min.css">
    <!-- Theme style -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/dist/css/adminlte.min.css">
    <style>
        .loader {
            display: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 5px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 4px;
            color: white;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1050;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-success { background-color: #28a745; }
        .toast-error { background-color: #dc3545; }
        
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            color: #6c757d;
            transition: color 0.2s;
        }
        .action-btn:hover { color: #495057; }
        .btn-edit:hover { color: #007bff; }
        .btn-delete:hover { color: #dc3545; }
    </style>
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper" style="background: #f4f6f9; min-height: 100vh;">
    <div class="content-header dashboard-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Quản lý Nhân sự</h1>
          </div>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <!-- Left col (Form) -->
          <div class="col-md-4">
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title" id="formTitle"><i class="fas fa-plus mr-1"></i> Thêm mới</h3>
              </div>
              <form id="dataForm">
                <input type="hidden" id="internalId">
                <div class="card-body">
                  <div class="row">
                    <div class="col-md-6 form-group">
                      <label for="code">Mã Nhân viên</label>
                      <input type="text" class="form-control" id="code" required>
                    </div>
                    <div class="col-md-6 form-group">
                      <label for="fullName">Họ và Tên</label>
                      <input type="text" class="form-control" id="fullName" required>
                    </div>
                  </div>
                  
                  <div class="row">
                    <div class="col-md-6 form-group">
                      <label for="departmentId">Khoa/Phòng</label>
                      <select class="form-control" id="departmentId">
                          <option value="">-- Chọn --</option>
                      </select>
                    </div>
                    <div class="col-md-6 form-group">
                      <label for="positionId">Chức vụ</label>
                      <select class="form-control" id="positionId">
                          <option value="">-- Chọn --</option>
                      </select>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6 form-group">
                      <label for="email">Email</label>
                      <input type="email" class="form-control" id="email">
                    </div>
                    <div class="col-md-6 form-group">
                      <label for="phone">Số điện thoại</label>
                      <input type="text" class="form-control" id="phone">
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6 form-group">
                      <label for="gender">Giới tính</label>
                      <select class="form-control" id="gender">
                          <option value="1">Nam</option>
                          <option value="2">Nữ</option>
                          <option value="0">Khác</option>
                      </select>
                    </div>
                    <div class="col-md-6 form-group">
                      <label for="dateOfBirth">Ngày sinh</label>
                      <input type="date" class="form-control" id="dateOfBirth">
                    </div>
                  </div>

                </div>
                <div class="card-footer">
                  <button type="submit" class="btn btn-primary" id="saveBtn">
                    <span id="saveBtnText">Lưu dữ liệu</span>
                    <div class="loader" id="saveLoader"></div>
                  </button>
                  <button type="button" class="btn btn-default float-right" style="display: none;" id="cancelBtn">Hủy bỏ</button>
                </div>
              </form>
            </div>
          </div>
          
          <!-- Right col (Table) -->
          <div class="col-md-8">
            <div class="card card-outline card-primary">
              <div class="card-header">
                <h3 class="card-title"><i class="fas fa-users mr-1"></i> Danh sách Nhân sự</h3>
              </div>
              <div class="card-body table-responsive p-0">
                <table class="table table-hover text-nowrap">
                  <thead>
                    <tr>
                      <th>Mã NV</th>
                      <th>Họ và Tên</th>
                      <th>Khoa/Phòng</th>
                      <th>Chức vụ</th>
                      <th>Điện thoại</th>
                      <th class="text-right">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody id="dataTableBody">
                  </tbody>
                </table>
                <div id="loadingMessage" class="text-center p-4 text-muted">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p class="mt-2">Đang tải dữ liệu...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
</div>

<!-- Toast Notification -->
<div id="toast">
    <i class="fas fa-check-circle fa-lg"></i>
    <span id="toastMessage">Thao tác thành công!</span>
</div>

<!-- jQuery & Bootstrap -->
<script src="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/plugins/jquery/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>

<script>
    const API_BASE_URL = '/api/employees';
    const DEPARTMENTS_API_URL = '/api/departments';
    const POSITIONS_API_URL = '/api/positions';

    const form = document.getElementById('dataForm');
    const internalIdInput = document.getElementById('internalId');
    const codeInput = document.getElementById('code');
    const fullNameInput = document.getElementById('fullName');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const genderSelect = document.getElementById('gender');
    const dateOfBirthInput = document.getElementById('dateOfBirth');
    const departmentSelect = document.getElementById('departmentId');
    const positionSelect = document.getElementById('positionId');
    const tableBody = document.getElementById('dataTableBody');
    const formTitle = document.getElementById('formTitle');
    const saveBtn = document.getElementById('saveBtn');
    const saveBtnText = document.getElementById('saveBtnText');
    const cancelBtn = document.getElementById('cancelBtn');
    const loadingMessage = document.getElementById('loadingMessage');

    let isEditMode = false;
    let departments = [];
    let positions = [];

    async function fetchDropdowns() {
        try {
            const [deptRes, posRes] = await Promise.all([
                fetch(DEPARTMENTS_API_URL),
                fetch(POSITIONS_API_URL)
            ]);
            
            if (deptRes.ok) departments = await deptRes.json();
            if (posRes.ok) positions = await posRes.json();
            
            populateDropdowns();
        } catch (error) {
            console.error('Failed to load dropdown data');
        }
    }

    function populateDropdowns() {
        departmentSelect.innerHTML = '<option value="">-- Chọn --</option>';
        departments.forEach(dept => {
            const option = document.createElement('option');
            option.value = dept.id;
            option.textContent = dept.name;
            departmentSelect.appendChild(option);
        });

        positionSelect.innerHTML = '<option value="">-- Chọn --</option>';
        positions.forEach(pos => {
            const option = document.createElement('option');
            option.value = pos.id;
            option.textContent = pos.name;
            positionSelect.appendChild(option);
        });
    }

    async function fetchData() {
        try {
            const response = await fetch(API_BASE_URL);
            if (!response.ok) throw new Error('Failed to fetch');
            const data = await response.json();
            renderTable(data);
        } catch (error) {
            showToast('Không thể kết nối đến máy chủ.', 'error');
            loadingMessage.innerHTML = '<p class="text-danger"><i class="fas fa-exclamation-triangle"></i> Lỗi kết nối.</p>';
        }
    }

    function renderTable(data) {
        loadingMessage.style.display = 'none';
        tableBody.innerHTML = '';
        
        if (data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-muted">Chưa có dữ liệu.</td></tr>';
            return;
        }

        data.forEach((item) => {
            const deptName = item.department ? item.department.name : '';
            const posName = item.position ? item.position.name : '';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-primary font-weight-bold">${item.code || ''}</td>
                <td>${item.fullName || ''}</td>
                <td>${deptName}</td>
                <td>${posName}</td>
                <td>${item.phone || ''}</td>
                <td class="text-right">
                    <button onclick='editItem(${JSON.stringify(item)})' class="action-btn btn-edit">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button onclick="deleteItem('${item.id}')" class="action-btn btn-delete">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const payload = {
            code: codeInput.value.trim(),
            fullName: fullNameInput.value.trim(),
            email: emailInput.value.trim(),
            phone: phoneInput.value.trim(),
            gender: genderSelect.value,
            dateOfBirth: dateOfBirthInput.value ? dateOfBirthInput.value : null,
            department: departmentSelect.value ? { id: departmentSelect.value } : null,
            position: positionSelect.value ? { id: positionSelect.value } : null
        };

        const localUuid = internalIdInput.value;
        const method = isEditMode ? 'PUT' : 'POST';
        const url = isEditMode ? `${API_BASE_URL}/${localUuid}` : API_BASE_URL;

        try {
            document.getElementById('saveLoader').style.display = 'inline-block';
            saveBtn.disabled = true;

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error('Action failed.');
            
            showToast(isEditMode ? 'Cập nhật thành công!' : 'Thêm mới thành công!');
            resetForm();
            fetchData();
        } catch (error) {
            showToast('Thao tác thất bại.', 'error');
        } finally {
            document.getElementById('saveLoader').style.display = 'none';
            saveBtn.disabled = false;
        }
    });

    window.editItem = (item) => {
        isEditMode = true;
        internalIdInput.value = item.id;
        codeInput.value = item.code || '';
        fullNameInput.value = item.fullName || '';
        emailInput.value = item.email || '';
        phoneInput.value = item.phone || '';
        genderSelect.value = item.gender || '1';
        dateOfBirthInput.value = item.dateOfBirth || '';

        if (item.department && item.department.id) {
            departmentSelect.value = item.department.id;
        } else {
            departmentSelect.value = "";
        }

        if (item.position && item.position.id) {
            positionSelect.value = item.position.id;
        } else {
            positionSelect.value = "";
        }

        formTitle.innerHTML = '<i class="fas fa-edit mr-1"></i> Cập nhật';
        saveBtnText.textContent = 'Lưu thay đổi';
        
        const cardHeader = formTitle.closest('.card');
        cardHeader.classList.remove('card-primary');
        cardHeader.classList.add('card-warning');
        
        saveBtn.classList.remove('btn-primary');
        saveBtn.classList.add('btn-warning');
        
        cancelBtn.style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteItem = async (id) => {
        if (confirm('Bạn có chắc chắn muốn xóa?')) {
            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Delete failed');
                
                showToast('Đã xóa thành công.');
                fetchData();
            } catch (error) {
                showToast('Không thể xóa.', 'error');
            }
        }
    };

    cancelBtn.addEventListener('click', resetForm);

    function resetForm() {
        form.reset();
        isEditMode = false;
        internalIdInput.value = '';
        formTitle.innerHTML = '<i class="fas fa-plus mr-1"></i> Thêm mới';
        saveBtnText.textContent = 'Lưu dữ liệu';
        
        const cardHeader = formTitle.closest('.card');
        cardHeader.classList.add('card-primary');
        cardHeader.classList.remove('card-warning');
        
        saveBtn.classList.add('btn-primary');
        saveBtn.classList.remove('btn-warning');
        cancelBtn.style.display = 'none';
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        document.getElementById('toastMessage').innerText = msg;
        
        toast.className = '';
        toast.classList.add(type === 'success' ? 'toast-success' : 'toast-error');
        toast.children[0].className = type === 'success' ? 'fas fa-check-circle fa-lg' : 'fas fa-times-circle fa-lg';
        
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    if (window.self !== window.top) {
        const header = document.querySelector('.dashboard-header');
        if (header) header.style.display = 'none';
        const wrapper = document.querySelector('.wrapper');
        if (wrapper) wrapper.style.background = 'transparent';
    }

    // Init
    fetchDropdowns().then(fetchData);
</script>
</body>
</html>
