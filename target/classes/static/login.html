<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - Hệ thống Quản lý</title>
  <link rel="stylesheet" href="css/modern.css">
  <style>
    body {
      display: flex;
      flex-direction: row;
      min-height: 100vh;
      margin: 0;
    }
    .login-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      position: relative;
      z-index: 1;
    }
    .login-right {
      flex: 1;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.8), rgba(16, 185, 129, 0.6)), url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&q=80') center/cover;
      display: none;
    }
    @media (min-width: 768px) {
      .login-right { display: flex; }
    }
    .login-box {
      width: 100%;
      max-width: 400px;
    }
    .brand-logo {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--text-main);
      text-align: center;
    }
    .brand-logo span { color: var(--primary); }
    .auth-footer { margin-top: 32px; text-align: center; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="login-left">
  <div class="login-box glass-panel p-4">
    <div class="brand-logo">Edu<span>Manager</span></div>
    <p class="text-center text-muted mb-4">Đăng nhập để tiếp tục</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <input type="text" class="form-control" id="username" placeholder="Nhập tên đăng nhập" required>
      </div>
      <div class="form-group mb-4">
        <label for="password">Mật khẩu</label>
        <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
      </div>
      
      <div id="errorAlert" class="alert alert-danger" style="display: none;">
        Sai tên đăng nhập hoặc mật khẩu!
      </div>
      
      <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%;">
        Đăng nhập
      </button>
    </form>

    <div class="auth-footer">
      Bạn là Sinh viên? <a href="register.html">Đăng ký tài khoản</a>
    </div>
  </div>
</div>
<div class="login-right">
  <!-- Right side background image/gradient -->
</div>

<script>
  if (localStorage.getItem('user')) {
    window.location.href = 'index.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const alertBox = document.getElementById('errorAlert');
    
    btn.disabled = true;
    btn.innerHTML = 'Đang xử lý...';
    alertBox.style.display = 'none';

    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.message || 'Đăng nhập thất bại');
      }

      const data = await response.json();
      localStorage.setItem('user', JSON.stringify(data));
      window.location.href = 'index.html';
    } catch (err) {
      alertBox.style.display = 'block';
      alertBox.textContent = err.message || 'Sai tên đăng nhập hoặc mật khẩu!';
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Đăng nhập';
    }
  });
</script>
</body>
</html>
