<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Program Management</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/dist/css/adminlte.min.css">
    <style>
        .loader { display: none; width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; margin-left: 5px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: 4px; color: white; font-weight: 500; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transform: translateY(100px); opacity: 0; transition: all 0.4s ease; z-index: 1050; display: flex; align-items: center; gap: 0.75rem; }
        #toast.show { transform: translateY(0); opacity: 1; }
        .toast-success { background-color: #28a745; }
        .toast-error { background-color: #dc3545; }
        .action-btn { background: none; border: none; cursor: pointer; padding: 0.2rem 0.5rem; color: #6c757d; transition: color 0.2s; }
        .action-btn:hover { color: #495057; }
        .btn-edit:hover { color: #007bff; }
        .btn-delete:hover { color: #dc3545; }
    </style>
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper" style="background: #f4f6f9; min-height: 100vh;">
    <div class="content-header dashboard-header">
      <div class="container-fluid"><div class="row mb-2"><div class="col-sm-6"><h1 class="m-0">Chương trình Đào tạo</h1></div></div></div>
    </div>
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-5">
            <div class="card card-primary">
              <div class="card-header"><h3 class="card-title" id="formTitle"><i class="fas fa-plus mr-1"></i> Thêm mới</h3></div>
              <form id="dataForm">
                <input type="hidden" id="internalId">
                <div class="card-body">
                  <div class="row">
                    <div class="col-6 form-group">
                      <label for="code">Mã CTĐT</label>
                      <input type="text" class="form-control" id="code" required>
                    </div>
                    <div class="col-6 form-group">
                      <label for="name">Tên CTĐT</label>
                      <input type="text" class="form-control" id="name" required>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-6 form-group">
                      <label for="majorId">Thuộc Ngành</label>
                      <select class="form-control" id="majorId"><option value="">-- Chọn Ngành --</option></select>
                    </div>
                    <div class="col-6 form-group">
                      <label for="departmentId">Khoa Quản lý</label>
                      <select class="form-control" id="departmentId"><option value="">-- Chọn Khoa --</option></select>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-4 form-group">
                      <label for="degreeLevel">Bậc đào tạo</label>
                      <input type="text" class="form-control" id="degreeLevel" placeholder="Đại học">
                    </div>
                    <div class="col-4 form-group">
                      <label for="educationType">Hệ đào tạo</label>
                      <input type="text" class="form-control" id="educationType" placeholder="Chính quy">
                    </div>
                    <div class="col-4 form-group">
                      <label for="totalCredits">Tổng tín chỉ</label>
                      <input type="number" step="0.5" class="form-control" id="totalCredits">
                    </div>
                  </div>
                </div>
                <div class="card-footer">
                  <button type="submit" class="btn btn-primary" id="saveBtn"><span id="saveBtnText">Lưu dữ liệu</span><div class="loader" id="saveLoader"></div></button>
                  <button type="button" class="btn btn-default float-right" style="display: none;" id="cancelBtn">Hủy bỏ</button>
                </div>
              </form>
            </div>
          </div>
          <div class="col-md-7">
            <div class="card card-outline card-primary">
              <div class="card-header"><h3 class="card-title"><i class="fas fa-list mr-1"></i> Danh sách CTĐT</h3></div>
              <div class="card-body table-responsive p-0">
                <table class="table table-hover text-nowrap">
                  <thead><tr><th>Mã</th><th>Tên CTĐT</th><th>Ngành</th><th>Tổng TC</th><th>Thao tác</th></tr></thead>
                  <tbody id="dataTableBody"></tbody>
                </table>
                <div id="loadingMessage" class="text-center p-4 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i><p class="mt-2">Đang tải...</p></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
</div>
<div id="toast"><i class="fas fa-check-circle fa-lg"></i><span id="toastMessage">Thành công!</span></div>
<script src="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/plugins/jquery/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE_URL = '/api/training-programs';
    const DEPT_API_URL = '/api/departments';
    const MAJOR_API_URL = '/api/majors';

    const form = document.getElementById('dataForm');
    const tableBody = document.getElementById('dataTableBody');
    let isEditMode = false;

    async function init() {
        try {
            const [deptRes, majorRes] = await Promise.all([fetch(DEPT_API_URL), fetch(MAJOR_API_URL)]);
            if(deptRes.ok) {
                const departments = await deptRes.json();
                const sel = document.getElementById('departmentId');
                departments.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id; opt.textContent = d.name;
                    sel.appendChild(opt);
                });
            }
            if(majorRes.ok) {
                const majors = await majorRes.json();
                const sel = document.getElementById('majorId');
                majors.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id; opt.textContent = m.name;
                    sel.appendChild(opt);
                });
            }
            fetchData();
        } catch(e) {}
    }

    async function fetchData() {
        try {
            const response = await fetch(API_BASE_URL);
            const data = await response.json();
            document.getElementById('loadingMessage').style.display = 'none';
            tableBody.innerHTML = '';
            if (data.length === 0) { tableBody.innerHTML = '<tr><td colspan="5" class="text-center p-4">Chưa có dữ liệu.</td></tr>'; return; }
            data.forEach((item) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-primary font-weight-bold">${item.code || ''}</td>
                    <td>${item.name || ''}</td>
                    <td>${item.major ? item.major.name : ''}</td>
                    <td>${item.totalCredits || 0}</td>
                    <td>
                        <button onclick='editItem(${JSON.stringify(item)})' class="action-btn btn-edit"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteItem('${item.id}')" class="action-btn btn-delete"><i class="fas fa-trash-alt"></i></button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        } catch (error) {}
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const deptId = document.getElementById('departmentId').value;
        const majorId = document.getElementById('majorId').value;
        const payload = {
            code: document.getElementById('code').value,
            name: document.getElementById('name').value,
            degreeLevel: document.getElementById('degreeLevel').value,
            educationType: document.getElementById('educationType').value,
            totalCredits: document.getElementById('totalCredits').value,
            department: deptId ? { id: deptId } : null,
            major: majorId ? { id: majorId } : null
        };
        const id = document.getElementById('internalId').value;
        const method = isEditMode ? 'PUT' : 'POST';
        const url = isEditMode ? `${API_BASE_URL}/${id}` : API_BASE_URL;
        
        try {
            document.getElementById('saveLoader').style.display = 'inline-block';
            await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            showToast('Thành công!');
            resetForm();
            fetchData();
        } catch(e) { showToast('Lỗi!', 'error'); } 
        finally { document.getElementById('saveLoader').style.display = 'none'; }
    });

    window.editItem = (item) => {
        isEditMode = true;
        document.getElementById('internalId').value = item.id;
        document.getElementById('code').value = item.code || '';
        document.getElementById('name').value = item.name || '';
        document.getElementById('degreeLevel').value = item.degreeLevel || '';
        document.getElementById('educationType').value = item.educationType || '';
        document.getElementById('totalCredits').value = item.totalCredits || '';
        document.getElementById('departmentId').value = item.department ? item.department.id : '';
        document.getElementById('majorId').value = item.major ? item.major.id : '';
        
        document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit"></i> Cập nhật';
        document.getElementById('saveBtnText').textContent = 'Lưu thay đổi';
        document.getElementById('cancelBtn').style.display = 'inline-block';
    };

    window.deleteItem = async (id) => {
        if(confirm('Xóa?')) {
            await fetch(`${API_BASE_URL}/${id}`, { method: 'DELETE' });
            fetchData();
        }
    };

    document.getElementById('cancelBtn').addEventListener('click', resetForm);
    function resetForm() {
        form.reset(); isEditMode = false; document.getElementById('internalId').value = '';
        document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus"></i> Thêm mới';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    function showToast(msg, type='success') {
        const toast = document.getElementById('toast');
        document.getElementById('toastMessage').innerText = msg;
        toast.className = 'show ' + (type === 'success' ? 'toast-success' : 'toast-error');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    if(window.self !== window.top) document.querySelector('.dashboard-header').style.display = 'none';
    init();
</script>
</body>
</html>
