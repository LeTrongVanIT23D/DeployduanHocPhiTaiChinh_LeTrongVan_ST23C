<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Phân Quyền</title>
  <link rel="stylesheet" href="css/modern.css">
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('iframe-mode');
    });
  </script>
</head>
<body>
  <div class="container p-4">
    <h2 class="page-title">Quản lý Phân Quyền Người Dùng</h2>
    
    <div class="card">
      <div class="card-header flex justify-between items-center">
        <span>Danh sách Người dùng</span>
        <button class="btn btn-primary btn-sm" onclick="openCreateAccountModal()"><i class="fas fa-plus"></i> Thêm Người Dùng</button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="modern-table" id="userTable">
            <thead>
              <tr>
                <th>Tên Đăng nhập</th>
                <th>Họ Tên</th>
                <th>Quyền hiện tại</th>
                <th class="text-right">Hành động</th>
              </tr>
            </thead>
            <tbody>
              <!-- Loaded dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Role Modal Backdrop -->
  <div class="modal-backdrop" id="roleModalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h5 class="modal-title">Quản lý Quyền</h5>
        <button class="modal-close" onclick="closeRoleModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p class="mb-4"><strong>Người dùng:</strong> <span id="modalUsername"></span></p>
        
        <div class="form-group flex items-center gap-2">
          <select class="form-control" id="roleSelect" style="flex:1;">
            <!-- Loaded dynamically -->
          </select>
          <button class="btn btn-primary" id="btnAddRole">Thêm Quyền</button>
        </div>
        
        <h6 class="mt-4 mb-2">Các Quyền Hiện Tại (Click xóa để gỡ)</h6>
        <div id="currentRolesList" class="flex-col gap-2 mt-2">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- Create Account Modal Backdrop -->
  <div class="modal-backdrop" id="createAccountModalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h5 class="modal-title">Tạo Tài Khoản Mới</h5>
        <button class="modal-close" onclick="closeCreateAccountModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="createAccountForm">
            <div class="form-group">
                <label>Tên đăng nhập *</label>
                <input type="text" id="newUsername" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu *</label>
                <input type="password" id="newPassword" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Họ Tên *</label>
                <input type="text" id="newFullName" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="newEmail" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Quyền khởi tạo</label>
                <select id="newRole" class="form-control">
                    <!-- Loaded dynamically -->
                </select>
            </div>
            <div class="mt-4 flex justify-between">
                <button type="button" class="btn" onclick="closeCreateAccountModal()">Hủy</button>
                <button type="submit" class="btn btn-primary" id="btnCreateAccount">Tạo Tài Khoản</button>
            </div>
        </form>
      </div>
    </div>
  </div>

<script>
  let allUsers = [];
  let allRoles = [];
  let selectedUserId = null;

  document.addEventListener('DOMContentLoaded', () => {
    const userStr = localStorage.getItem('user');
    if (!userStr) {
      window.top.location.href = 'login.html';
      return;
    }
    const currentUser = JSON.parse(userStr);
    const roles = currentUser.roles || [];
    const hasAdmin = roles.includes('SUPER_ADMIN') || roles.some(r => r.code === 'SUPER_ADMIN');
    if (!hasAdmin) {
      alert('Bạn không có quyền truy cập trang này!');
      if(window.self !== window.top) window.top.location.href = 'index.html';
      else window.location.href = 'index.html';
      return;
    }

    loadUsers();
    loadRoles();

    document.getElementById('btnAddRole').addEventListener('click', addRoleToUser);
  });

  function loadUsers() {
    fetch('/api/users')
      .then(res => res.json())
      .then(data => {
        allUsers = data;
        renderUsers();
      })
      .catch(err => console.error(err));
  }

  function loadRoles() {
    fetch('/api/roles')
      .then(res => res.json())
      .then(data => {
        allRoles = data;
        const select = document.getElementById('roleSelect');
        select.innerHTML = '';
        data.forEach(role => {
          select.innerHTML += `<option value="${role.id}">${role.name} (${role.code})</option>`;
        });
      })
      .catch(err => console.error(err));
  }

  function renderUsers() {
    const tbody = document.querySelector('#userTable tbody');
    tbody.innerHTML = '';
    allUsers.forEach(u => {
      let rolesStr = '';
      if(u.roles) {
         if(typeof u.roles[0] === 'string') {
             rolesStr = u.roles.map(r => `<span class="badge badge-primary mr-1">${r}</span>`).join('');
         } else {
             rolesStr = u.roles.map(r => `<span class="badge badge-primary mr-1">${r.name}</span>`).join('');
         }
      }
      tbody.innerHTML += `
        <tr>
          <td class="font-weight-bold text-primary">${u.username}</td>
          <td>${u.fullName || ''}</td>
          <td>${rolesStr}</td>
          <td class="text-right">
            <button class="btn btn-sm btn-primary" onclick="openRoleModal('${u.id}')">Quản lý</button>
          </td>
        </tr>
      `;
    });
  }

  function openRoleModal(userId) {
    selectedUserId = userId;
    const user = allUsers.find(u => u.id === userId);
    document.getElementById('modalUsername').innerText = user.username + ' - ' + (user.fullName || '');
    
    const list = document.getElementById('currentRolesList');
    list.innerHTML = '';
    (user.roles || []).forEach(r => {
      const roleName = typeof r === 'string' ? r : r.name;
      const roleId = typeof r === 'string' ? r : r.id; 
      
      list.innerHTML += `
        <div class="glass-panel p-2 flex justify-between items-center" style="background: rgba(255,255,255,0.02);">
          <span>${roleName}</span>
          <button class="btn btn-sm btn-danger" onclick="removeRole('${userId}', '${roleId}')">Xóa</button>
        </div>
      `;
    });
    
    document.getElementById('roleModalBackdrop').classList.add('show');
  }
  
  function closeRoleModal() {
    document.getElementById('roleModalBackdrop').classList.remove('show');
  }

  function addRoleToUser() {
    if (!selectedUserId) return;
    const roleId = document.getElementById('roleSelect').value;
    
    fetch(`/api/users/${selectedUserId}/roles/${roleId}`, { method: 'POST' })
      .then(res => {
        if (!res.ok) throw new Error('Thêm thất bại');
        return res.json();
      })
      .then(() => {
        loadUsers();
        closeRoleModal();
        alert('Đã thêm quyền thành công!');
      })
      .catch(err => alert(err.message));
  }

  function removeRole(userId, roleId) {
    if (!confirm('Bạn có chắc muốn xóa quyền này?')) return;
    fetch(`/api/users/${userId}/roles/${roleId}`, { method: 'DELETE' })
      .then(res => {
        if (!res.ok) throw new Error('Xóa thất bại');
        return res.json();
      })
      .then(() => {
        loadUsers();
        closeRoleModal();
        alert('Đã xóa quyền thành công!');
      })
      .catch(err => alert(err.message));
  }

  function openCreateAccountModal() {
    document.getElementById('createAccountForm').reset();
    
    const select = document.getElementById('newRole');
    select.innerHTML = '<option value="">-- Không gán quyền --</option>';
    allRoles.forEach(role => {
        select.innerHTML += `<option value="${role.id}">${role.name} (${role.code})</option>`;
    });

    document.getElementById('createAccountModalBackdrop').classList.add('show');
  }

  function closeCreateAccountModal() {
    document.getElementById('createAccountModalBackdrop').classList.remove('show');
  }

  document.getElementById('createAccountForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnCreateAccount');
    btn.disabled = true;
    btn.innerText = 'Đang tạo...';

    const userData = {
        username: document.getElementById('newUsername').value,
        password: document.getElementById('newPassword').value,
        fullName: document.getElementById('newFullName').value,
        email: document.getElementById('newEmail').value
    };

    try {
        const res = await fetch('/api/users/create-with-details', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
        });

        if (!res.ok) {
            const errorText = await res.text();
            throw new Error(errorText || 'Lỗi khi tạo tài khoản');
        }

        const newUser = await res.json();
        
        const roleId = document.getElementById('newRole').value;
        if (roleId) {
            await fetch(`/api/users/${newUser.id}/roles/${roleId}`, { method: 'POST' });
        }

        alert('Tạo tài khoản thành công!');
        closeCreateAccountModal();
        loadUsers();
    } catch (err) {
        alert('Lỗi: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.innerText = 'Tạo Tài Khoản';
    }
  });
</script>
</body>
</html>
