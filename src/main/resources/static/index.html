<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng điều khiển - Hệ thống Quản lý</title>
  <link rel="stylesheet" href="css/modern.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      flex-direction: row;
      overflow: hidden;
    }
    
    .sidebar {
      width: 260px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: all 0.3s ease;
      z-index: 100;
    }
    
    .brand {
      padding: 24px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      border-bottom: 1px solid var(--surface-border);
      text-align: center;
    }
    .brand span { color: var(--primary); }
    
    .nav-menu {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
    }
    
    .nav-header {
      padding: 12px 24px 8px;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    
    .nav-item {
      display: block;
      padding: 12px 24px;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s;
      border-left: 3px solid transparent;
      cursor: pointer;
    }
    
    .nav-item:hover, .nav-item.active {
      background: rgba(255, 255, 255, 0.05);
      border-left-color: var(--primary);
    }
    
    .nav-item i {
      width: 20px;
      text-align: center;
      color: var(--primary);
    }
    
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }
    
    .topbar {
      height: 70px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 24px;
      gap: 24px;
      z-index: 10;
    }
    
    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    
    #content-iframe {
      flex: 1;
      border: none;
      width: 100%;
      height: calc(100vh - 70px);
      background: transparent;
    }
  </style>
  <script>
    const userStr = localStorage.getItem('user');
    if (!userStr) {
      window.location.href = 'login.html';
    } else {
      const user = JSON.parse(userStr);
      
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('displayUsername').innerText = user.fullName || user.username || 'Người dùng';
        document.getElementById('userInitials').innerText = (user.fullName || user.username || 'U').charAt(0).toUpperCase();
        
        const roles = user.roles || [];
        // Kiểm tra an toàn cho cả trường hợp API trả mảng chuỗi hoặc mảng object
        const hasAdmin = roles.includes('SUPER_ADMIN') || roles.some(r => r.code === 'SUPER_ADMIN' || r === 'SUPER_ADMIN');
        const hasTeacher = roles.includes('TEACHER') || roles.some(r => r.code === 'TEACHER' || r === 'TEACHER');

        document.querySelectorAll('.role-admin, .role-teacher').forEach(el => {
          el.style.display = 'none';
        });

        if (hasAdmin) {
          document.querySelectorAll('.role-admin, .role-teacher').forEach(el => {
            el.style.display = el.classList.contains('nav-header') ? 'block' : 'flex';
          });
        } else if (hasTeacher) {
          document.querySelectorAll('.role-teacher').forEach(el => {
            el.style.display = el.classList.contains('nav-header') ? 'block' : 'flex';
          });
        }
      });
    }

    function loadPage(url, element) {
      document.getElementById('content-iframe').src = url;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      if(element) element.classList.add('active');
    }
  </script>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand">Edu<span>Manager</span></div>
    <div class="nav-menu">
      
      <a onclick="loadPage('dashboard_content.html', this)" class="nav-item active">
        <i class="fas fa-tachometer-alt"></i> Bảng điều khiển
      </a>

      <div class="nav-header">CÁ NHÂN</div>
      <a onclick="loadPage('profile.html', this)" class="nav-item">
        <i class="fas fa-user"></i> Hồ sơ của tôi
      </a>

      <div class="nav-header role-admin" style="display:none;">CƠ CẤU TỔ CHỨC</div>
      <a onclick="loadPage('department_manager.html', this)" class="nav-item role-admin" style="display:none;">
        <i class="fas fa-building"></i> Quản lý Khoa/Phòng
      </a>
      <a onclick="loadPage('position_manager.html', this)" class="nav-item role-admin" style="display:none;">
        <i class="fas fa-sitemap"></i> Quản lý Chức vụ
      </a>
      <a onclick="loadPage('employee_manager.html', this)" class="nav-item role-admin" style="display:none;">
        <i class="fas fa-user-tie"></i> Quản lý Nhân sự
      </a>

      <div class="nav-header role-admin role-teacher" style="display:none;">CHƯƠNG TRÌNH ĐÀO TẠO</div>
      <a onclick="loadPage('major_manager.html', this)" class="nav-item role-admin" style="display:none;">
        <i class="fas fa-graduation-cap"></i> Ngành Đào tạo
      </a>
      <a onclick="loadPage('training_program_manager.html', this)" class="nav-item role-admin" style="display:none;">
        <i class="fas fa-list-alt"></i> Chương trình Đào tạo
      </a>
      <a onclick="loadPage('course_manager.html', this)" class="nav-item role-admin role-teacher" style="display:none;">
        <i class="fas fa-book"></i> Học phần / Môn học
      </a>

      <div class="nav-header role-admin role-teacher" style="display:none;">QUẢN LÝ ĐÀO TẠO</div>
      <a onclick="loadPage('student_manager.html', this)" class="nav-item role-admin role-teacher" style="display:none;">
        <i class="fas fa-users"></i> Quản lý Sinh viên
      </a>
      <a onclick="loadPage('tuition_manager.html', this)" class="nav-item role-admin" style="display:none;">
        <i class="fas fa-file-invoice-dollar"></i> Quản lý Học phí
      </a>

      <div class="nav-header role-admin" style="display:none;">HỆ THỐNG</div>
      <a onclick="loadPage('user_role_manager.html', this)" class="nav-item role-admin" style="display:none;">
        <i class="fas fa-user-shield"></i> Phân quyền Người dùng
      </a>
      
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-wrapper">
    <!-- Topbar -->
    <div class="topbar">
      <div class="user-profile">
        <div class="avatar" id="userInitials">U</div>
        <span id="displayUsername" style="font-weight: 500;">Người dùng</span>
      </div>
      <a href="#" id="btnLogout" class="btn btn-sm btn-danger">
        <i class="fas fa-sign-out-alt"></i> Đăng xuất
      </a>
    </div>

    <!-- Iframe Content -->
    <iframe id="content-iframe" src="dashboard_content.html"></iframe>
  </div>

  <script>
    document.getElementById('btnLogout').addEventListener('click', function(e) {
      e.preventDefault();
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
