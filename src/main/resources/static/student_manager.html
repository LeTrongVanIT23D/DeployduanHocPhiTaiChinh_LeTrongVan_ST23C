<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh viên</title>
    <link rel="stylesheet" href="css/modern.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .loader {
            display: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 5px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Toast notification */
        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1050;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            backdrop-filter: blur(12px);
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-success { border-left: 4px solid var(--success); }
        .toast-error { border-left: 4px solid var(--danger); }
        
        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            cursor: pointer;
            padding: 6px 10px;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
        .btn-edit:hover { color: var(--primary); border-color: var(--primary); }
        .btn-delete:hover { color: var(--danger); border-color: var(--danger); }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('iframe-mode');
      });
    </script>
</head>
<body>
  <div class="container p-4">
    <h2 class="page-title">Quản lý Sinh viên</h2>

    <div class="grid md:grid-cols-3 gap-4">
      <!-- Left col (Form) -->
      <div class="md:col-span-1">
        <div class="card" id="formCard">
          <div class="card-header" id="formTitle">
            <span class="flex items-center gap-2"><i class="fas fa-user-plus text-primary"></i> Thêm Sinh viên mới</span>
          </div>
          <form id="studentForm">
            <input type="hidden" id="internalId">
            <div class="card-body">
              <div class="form-group">
                <label for="studentId">Mã SV</label>
                <input type="text" class="form-control" id="studentId" placeholder="VD: SV001" required>
              </div>
              <div class="form-group">
                <label for="name">Họ và Tên</label>
                <input type="text" class="form-control" id="name" placeholder="VD: Nguyễn Văn A" required>
              </div>
              <div class="form-group">
                <label for="email">Địa chỉ Email</label>
                <input type="email" class="form-control" id="email" placeholder="name@school.edu" required>
              </div>
            </div>
            <div class="card-footer">
              <button type="button" class="btn" style="display: none;" id="cancelBtn">Hủy bỏ</button>
              <button type="submit" class="btn btn-primary" id="saveBtn">
                <span id="saveBtnText">Lưu dữ liệu</span>
                <div class="loader" id="saveLoader"></div>
              </button>
            </div>
          </form>
        </div>
      </div>
      
      <!-- Right col (Table) -->
      <div class="md:col-span-2" style="grid-column: span 2;">
        <div class="card">
          <div class="card-header flex justify-between items-center">
            <span class="flex items-center gap-2"><i class="fas fa-users text-primary"></i> Danh sách Sinh viên</span>
            <span class="badge badge-success">Trực tiếp</span>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="modern-table">
                <thead>
                  <tr>
                    <th>Mã SV</th>
                    <th>Họ và Tên</th>
                    <th>Email</th>
                    <th class="text-right">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="studentTableBody">
                  <!-- Student rows injected by JS -->
                </tbody>
              </table>
            </div>
            <div id="loadingMessage" class="text-center p-4 text-muted">
                <i class="fas fa-spinner fa-spin fa-2x mb-2"></i>
                <p>Đang tải dữ liệu...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast">
      <i id="toastIcon" class="fas fa-check-circle fa-lg"></i>
      <span id="toastMessage">Thao tác thành công!</span>
  </div>

<script>
    const API_BASE_URL = '/api/students';

    const form = document.getElementById('studentForm');
    const internalIdInput = document.getElementById('internalId');
    const studentIdInput = document.getElementById('studentId');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const tableBody = document.getElementById('studentTableBody');
    const formTitle = document.getElementById('formTitle');
    const saveBtn = document.getElementById('saveBtn');
    const saveBtnText = document.getElementById('saveBtnText');
    const cancelBtn = document.getElementById('cancelBtn');
    const loadingMessage = document.getElementById('loadingMessage');
    const formCard = document.getElementById('formCard');

    let isEditMode = false;

    async function fetchStudents() {
        try {
            const response = await fetch(API_BASE_URL);
            if (!response.ok) throw new Error('Failed to load API');
            const students = await response.json();
            renderTable(students);
        } catch (error) {
            showToast('Không thể kết nối đến máy chủ.', 'error');
            loadingMessage.innerHTML = '<p class="text-danger"><i class="fas fa-exclamation-triangle"></i> Lỗi kết nối đến máy chủ API.</p>';
        }
    }

    function renderTable(students) {
        loadingMessage.style.display = 'none';
        tableBody.innerHTML = '';
        
        if (students.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" class="text-center p-4 text-muted">Chưa có dữ liệu sinh viên.</td></tr>';
            return;
        }

        students.forEach((student) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-primary font-weight-bold">${student.studentId}</td>
                <td>${student.name}</td>
                <td>${student.email}</td>
                <td class="text-right">
                    <button onclick='editStudent(${JSON.stringify(student)})' class="action-btn btn-edit" title="Sửa">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button onclick="deleteStudent('${student.id}')" class="action-btn btn-delete" title="Xóa">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const studentData = {
            studentId: studentIdInput.value.trim(),
            name: nameInput.value.trim(),
            email: emailInput.value.trim()
        };

        const localUuid = internalIdInput.value;
        const method = isEditMode ? 'PUT' : 'POST';
        const url = isEditMode ? `${API_BASE_URL}/${localUuid}` : API_BASE_URL;

        try {
            document.getElementById('saveLoader').style.display = 'inline-block';
            saveBtn.disabled = true;

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentData)
            });

            if (!response.ok) throw new Error('Action failed.');
            
            showToast(isEditMode ? 'Cập nhật thành công!' : 'Thêm mới thành công!');
            resetForm();
            fetchStudents();
        } catch (error) {
            showToast('Thao tác thất bại.', 'error');
        } finally {
            document.getElementById('saveLoader').style.display = 'none';
            saveBtn.disabled = false;
        }
    });

    window.editStudent = (student) => {
        isEditMode = true;
        internalIdInput.value = student.id;
        studentIdInput.value = student.studentId;
        nameInput.value = student.name;
        emailInput.value = student.email;

        formTitle.innerHTML = '<span class="flex items-center gap-2"><i class="fas fa-edit text-warning"></i> Cập nhật Sinh viên</span>';
        saveBtnText.textContent = 'Lưu thay đổi';
        
        saveBtn.classList.remove('btn-primary');
        saveBtn.classList.add('btn-warning');
        
        cancelBtn.style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteStudent = async (id) => {
        if (confirm('Bạn có chắc chắn muốn xóa sinh viên này?')) {
            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Delete failed');
                
                showToast('Đã xóa thành công.');
                fetchStudents();
            } catch (error) {
                showToast('Không thể xóa.', 'error');
            }
        }
    };

    cancelBtn.addEventListener('click', resetForm);

    function resetForm() {
        form.reset();
        isEditMode = false;
        internalIdInput.value = '';
        formTitle.innerHTML = '<span class="flex items-center gap-2"><i class="fas fa-user-plus text-primary"></i> Thêm Sinh viên mới</span>';
        saveBtnText.textContent = 'Lưu dữ liệu';
        
        saveBtn.classList.add('btn-primary');
        saveBtn.classList.remove('btn-warning');
        cancelBtn.style.display = 'none';
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const icon = document.getElementById('toastIcon');
        document.getElementById('toastMessage').innerText = msg;
        
        toast.className = '';
        if (type === 'success') {
            toast.classList.add('toast-success');
            icon.className = 'fas fa-check-circle fa-lg text-success';
        } else {
            toast.classList.add('toast-error');
            icon.className = 'fas fa-times-circle fa-lg text-danger';
        }
        
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3500);
    }

    fetchStudents();
</script>
</body>
</html>
