<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>
    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/plugins/fontawesome-free/css/all.min.css">
    <!-- Theme style -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/dist/css/adminlte.min.css">
    <style>
        .loader {
            display: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 5px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Toast notification */
        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 4px;
            color: white;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1050;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-success { background-color: #28a745; }
        .toast-error { background-color: #dc3545; }
        
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            color: #6c757d;
            transition: color 0.2s;
        }
        .action-btn:hover { color: #495057; }
        .btn-edit:hover { color: #007bff; }
        .btn-delete:hover { color: #dc3545; }
    </style>
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper" style="background: #f4f6f9; min-height: 100vh;">
    <!-- Content Header (Page header) -->
    <div class="content-header dashboard-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Quản lý Sinh viên</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="#">Trang chủ</a></li>
              <li class="breadcrumb-item active">Sinh viên</li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <!-- Left col (Form) -->
          <div class="col-md-4">
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title" id="formTitle"><i class="fas fa-user-plus mr-1"></i> Thêm Sinh viên mới</h3>
              </div>
              <!-- /.card-header -->
              <!-- form start -->
              <form id="studentForm">
                <input type="hidden" id="internalId">
                <div class="card-body">
                  <div class="form-group">
                    <label for="studentId">Mã SV</label>
                    <input type="text" class="form-control" id="studentId" placeholder="VD: SV001" required>
                  </div>
                  <div class="form-group">
                    <label for="name">Họ và Tên</label>
                    <input type="text" class="form-control" id="name" placeholder="VD: Nguyễn Văn A" required>
                  </div>
                  <div class="form-group">
                    <label for="email">Địa chỉ Email</label>
                    <input type="email" class="form-control" id="email" placeholder="name@school.edu" required>
                  </div>
                </div>
                <!-- /.card-body -->

                <div class="card-footer">
                  <button type="submit" class="btn btn-primary" id="saveBtn">
                    <span id="saveBtnText">Lưu dữ liệu</span>
                    <div class="loader" id="saveLoader" style="display: none;"></div>
                  </button>
                  <button type="button" class="btn btn-default float-right" style="display: none;" id="cancelBtn">Hủy bỏ</button>
                </div>
              </form>
            </div>
          </div>
          
          <!-- Right col (Table) -->
          <div class="col-md-8">
            <div class="card card-outline card-primary">
              <div class="card-header">
                <h3 class="card-title"><i class="fas fa-users mr-1"></i> Danh sách Sinh viên</h3>
                <div class="card-tools">
                    <span class="badge badge-success"><i class="fas fa-sync-alt"></i> Trực tiếp</span>
                </div>
              </div>
              <!-- /.card-header -->
              <div class="card-body table-responsive p-0">
                <table class="table table-hover text-nowrap">
                  <thead>
                    <tr>
                      <th>Mã SV</th>
                      <th>Họ và Tên</th>
                      <th>Email</th>
                      <th class="text-right">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody id="studentTableBody">
                    <!-- Student rows injected by JS -->
                  </tbody>
                </table>
                <div id="loadingMessage" class="text-center p-4 text-muted">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p class="mt-2">Đang tải dữ liệu...</p>
                </div>
              </div>
              <!-- /.card-body -->
            </div>
          </div>
        </div>
      </div>
    </section>
</div>

<!-- Toast Notification -->
<div id="toast">
    <i class="fas fa-check-circle fa-lg"></i>
    <span id="toastMessage">Thao tác thành công!</span>
</div>

<!-- jQuery -->
<script src="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/plugins/jquery/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/gh/ColorlibHQ/AdminLTE@3.2.0/dist/js/adminlte.min.js"></script>

<script>
    const API_BASE_URL = '/api/students';

    // DOM Elements
    const form = document.getElementById('studentForm');
    const internalIdInput = document.getElementById('internalId');
    const studentIdInput = document.getElementById('studentId');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const tableBody = document.getElementById('studentTableBody');
    const formTitle = document.getElementById('formTitle');
    const saveBtn = document.getElementById('saveBtn');
    const saveBtnText = document.getElementById('saveBtnText');
    const cancelBtn = document.getElementById('cancelBtn');
    const loadingMessage = document.getElementById('loadingMessage');

    let isEditMode = false;

    // Fetch & render data on UI load
    async function fetchStudents() {
        try {
            const response = await fetch(API_BASE_URL);
            if (!response.ok) throw new Error('Failed to load proxy');
            const students = await response.json();
            renderTable(students);
        } catch (error) {
            showToast('Không thể kết nối đến máy chủ.', 'error');
            loadingMessage.innerHTML = '<p class="text-danger"><i class="fas fa-exclamation-triangle"></i> Lỗi kết nối đến máy chủ API.</p>';
        }
    }

    // Render Table
    function renderTable(students) {
        loadingMessage.style.display = 'none';
        tableBody.innerHTML = '';
        
        if (students.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" class="text-center p-4 text-muted">Chưa có dữ liệu sinh viên.</td></tr>';
            return;
        }

        students.forEach((student) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-primary font-weight-bold">${student.studentId}</td>
                <td>${student.name}</td>
                <td>${student.email}</td>
                <td class="text-right">
                    <button onclick='editStudent(${JSON.stringify(student)})' class="action-btn btn-edit" title="Sửa">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button onclick="deleteStudent('${student.id}')" class="action-btn btn-delete" title="Xóa">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // Handle Add/Update Form Submit
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const studentData = {
            studentId: studentIdInput.value.trim(),
            name: nameInput.value.trim(),
            email: emailInput.value.trim()
        };

        const localUuid = internalIdInput.value;
        const method = isEditMode ? 'PUT' : 'POST';
        const url = isEditMode ? `${API_BASE_URL}/${localUuid}` : API_BASE_URL;

        try {
            document.getElementById('saveLoader').style.display = 'inline-block';
            saveBtn.disabled = true;

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentData)
            });

            if (!response.ok) throw new Error('Action failed.');
            
            showToast(isEditMode ? 'Cập nhật thành công!' : 'Thêm mới thành công!');
            resetForm();
            fetchStudents();
        } catch (error) {
            showToast('Thao tác thất bại.', 'error');
        } finally {
            document.getElementById('saveLoader').style.display = 'none';
            saveBtn.disabled = false;
        }
    });

    // Setup Edit Mode
    window.editStudent = (student) => {
        isEditMode = true;
        internalIdInput.value = student.id;
        studentIdInput.value = student.studentId;
        nameInput.value = student.name;
        emailInput.value = student.email;

        formTitle.innerHTML = '<i class="fas fa-edit mr-1"></i> Cập nhật Sinh viên';
        saveBtnText.textContent = 'Lưu thay đổi';
        
        const cardHeader = formTitle.closest('.card');
        cardHeader.classList.remove('card-primary');
        cardHeader.classList.add('card-warning');
        
        saveBtn.classList.remove('btn-primary');
        saveBtn.classList.add('btn-warning');
        
        cancelBtn.style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Complete Delete Action
    window.deleteStudent = async (id) => {
        if (confirm('Bạn có chắc chắn muốn xóa sinh viên này?')) {
            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Delete failed');
                
                showToast('Đã xóa thành công.');
                fetchStudents();
            } catch (error) {
                showToast('Không thể xóa.', 'error');
            }
        }
    };

    // Reset the form state
    cancelBtn.addEventListener('click', resetForm);

    function resetForm() {
        form.reset();
        isEditMode = false;
        internalIdInput.value = '';
        formTitle.innerHTML = '<i class="fas fa-user-plus mr-1"></i> Thêm Sinh viên mới';
        saveBtnText.textContent = 'Lưu dữ liệu';
        
        const cardHeader = formTitle.closest('.card');
        cardHeader.classList.add('card-primary');
        cardHeader.classList.remove('card-warning');
        
        saveBtn.classList.add('btn-primary');
        saveBtn.classList.remove('btn-warning');
        cancelBtn.style.display = 'none';
    }

    // Show fancy toast notification
    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        document.getElementById('toastMessage').innerText = msg;
        
        toast.className = '';
        toast.classList.add(type === 'success' ? 'toast-success' : 'toast-error');
        toast.children[0].className = type === 'success' ? 'fas fa-check-circle fa-lg' : 'fas fa-times-circle fa-lg';
        
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3500);
    }

    // Hide header if loaded inside an iframe
    if (window.self !== window.top) {
        const header = document.querySelector('.dashboard-header');
        if (header) header.style.display = 'none';
        
        // Remove padding from wrapper to fit perfectly in iframe
        const wrapper = document.querySelector('.wrapper');
        if (wrapper) wrapper.style.background = 'transparent';
    }

    // Init App On Load
    fetchStudents();
</script>
</body>
</html>
